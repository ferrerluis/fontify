[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fontify"
version = "0.1.0"
description = "Build reviewable fonts from explicit vector glyphs, offline first."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fonttools[woff]>=4.60,<5",
  "uharfbuzz>=0.50,<1",
  "skia-pathops>=0.8,<1",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
recraft = ["httpx>=0.28,<1"]
dev = ["pytest>=8,<10", "build>=1,<2", "httpx>=0.28,<1", "ruff>=0.14,<1", "PyYAML>=6,<7"]

[project.scripts]
fontify = "fontify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
